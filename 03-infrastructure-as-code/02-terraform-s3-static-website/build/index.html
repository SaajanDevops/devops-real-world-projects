<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terraform S3 Website</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      .card {
        background: white;
        padding: 50px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h1 {
        color: #333;
        margin-bottom: 15px;
      }

      p {
        color: #666;
        font-size: 18px;
      }

      .badge {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background: #667eea;
        color: white;
        border-radius: 25px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>🚀 Hello from S3!</h1>
      <p>This website is hosted on Amazon S3.</p>
      <span class="badge">Deployed with Terraform</span>
    </div>
  </body>
</html>
