<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }

      .error-card {
        text-align: center;
        background: white;
        padding: 50px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 60px;
        margin: 0;
        color: #e74c3c;
      }

      h2 {
        color: #333;
      }

      p {
        color: #666;
      }

      a {
        display: inline-block;
        margin-top: 15px;
        padding: 12px 25px;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 25px;
      }

      a:hover {
        background: #5568d9;
      }
    </style>
  </head>

  <body>
    <div class="error-card">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>Sorry, the page you're looking for doesn't exist.</p>
      <a href="index.html">Go to Homepage</a>
    </div>
  </body>
</html>
